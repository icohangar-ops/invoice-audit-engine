name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parity:
    # The eight invoice anomaly rules also exists as TypeScript in @cubiczan/finance-engines. This job
    # proves the two still agree: it checks out finance-engines as a sibling and
    # runs its cross-language parity suite against this repo's adapter.
    #
    # Without this, a formula can drift between the two stacks and produce two
    # different numbers for the same input, silently.
    runs-on: ubuntu-latest
    steps:
      - name: Require the parity token
        # Fail with an actionable message rather than actions/checkout's cryptic
        # "Input required and not supplied: token". Still fail-closed: a missing
        # secret must never be mistaken for confirmed parity.
        run: |
          if [ -z "${{ secrets.FINANCE_ENGINES_TOKEN }}" ]; then
            echo "::error::FINANCE_ENGINES_TOKEN is not set, so cross-language parity did NOT run."
            echo ""
            echo "This job needs read access to the private icohangar-ops/finance-engines"
            echo "repo, which holds the parity vectors and runner. To enable it:"
            echo ""
            echo "  gh secret set FINANCE_ENGINES_TOKEN --repo icohangar-ops/${{ github.event.repository.name }}"
            echo ""
            echo "(or set it once at org level so all three donor repos inherit it)"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: invoice-audit-engine

      - name: Check out finance-engines (parity vectors + runner)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: icohangar-ops/finance-engines
          path: finance-engines
          # finance-engines is private, so this needs a token with read access to
          # it. Add FINANCE_ENGINES_TOKEN as a repo or org secret. If it is absent
          # the checkout step errors and the job fails — fail-closed, so a missing
          # secret can never be mistaken for confirmed parity.
          token: ${{ secrets.FINANCE_ENGINES_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install this engine
        run: pip install -e .
        working-directory: invoice-audit-engine

      - name: Build finance-engines
        run: npm ci && npm run build
        working-directory: finance-engines

      - name: Cross-language parity
        run: |
          python3 spec/run_parity.py \
            --suite pyformat --suite audit \
            --adapter-cmd "python3 ../invoice-audit-engine/spec_adapter.py"
        working-directory: finance-engines
