[project]
name = "invoice-audit-engine"
version = "0.1.0"
description = "Continuous vendor invoice anomaly detection for Precoro-based procure-to-pay"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"auditengine/ui.py" = ["E501"]  # embedded CSS strings

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
